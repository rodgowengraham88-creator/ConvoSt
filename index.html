<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Starters">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171b" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Starters</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1c1c1e; --muted:#6c6b70; --line:#e7e3d9;
  --chip:#ebe7dd; --accent:#d9573b; --star:#e8a317; --star-off:#dcd7cc;
  --danger:#c8382a; --shadow:0 1px 2px rgba(40,30,10,.06),0 0 0 1px var(--line);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16171b; --card:#212227; --ink:#f2f2f4; --muted:#9b9ba3; --line:#2e2f36;
    --chip:#2a2b31; --accent:#ff7a59; --star:#f5b83d; --star-off:#3c3d45;
    --danger:#ff6b5c; --shadow:0 0 0 1px var(--line);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.3}
input,textarea{font:inherit;color:var(--ink)}
svg{display:block}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:5;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  -webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);
  padding:calc(env(safe-area-inset-top) + 6px) 16px 8px;
  border-bottom:1px solid transparent;transition:border-color .2s;
}
.top.scrolled{border-bottom-color:var(--line)}
.title-row{display:flex;align-items:center;gap:4px;height:46px}
h1{font-size:30px;font-weight:760;letter-spacing:-.025em;margin:0;flex:1}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:active{background:var(--chip)}
.icon-btn svg{width:23px;height:23px}
.icon-btn.sm{width:36px;height:36px}
.icon-btn.sm svg{width:19px;height:19px}
.icon-btn.on{background:var(--chip)}
.search{display:none;padding:2px 0 8px}
.search.on{display:block}
.search input{
  width:100%;height:42px;border-radius:12px;border:0;background:var(--chip);
  padding:0 14px;font-size:16px;outline:none;-webkit-appearance:none;
}
.chips{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  margin:0 -16px;padding:4px 16px 10px;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:38px;padding:0 15px;border-radius:19px;background:var(--chip);
  display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:620;white-space:nowrap;
  transition:background .15s,color .15s;
}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip .n{font-weight:500;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.on .n{color:inherit;opacity:.65}
.sortbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:2px}
.seg button{height:30px;padding:0 13px;border-radius:8px;font-size:13px;font-weight:620;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- list ---------- */
main{padding:10px 16px;min-height:60vh}
main.slide-l{animation:inL .22s ease-out}
main.slide-r{animation:inR .22s ease-out}
@keyframes inL{from{opacity:.2;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:.2;transform:translateX(-28px)}to{opacity:1;transform:none}}
.card{
  background:var(--card);border-radius:16px;padding:14px 8px 12px 16px;margin-bottom:10px;
  box-shadow:var(--shadow);
}
.row1{display:flex;gap:4px;align-items:flex-start}
.stmt{flex:1;margin:3px 0 0;font-size:17px;font-weight:620;line-height:1.3;letter-spacing:-.005em;word-wrap:break-word;min-width:0}
.row1 .icon-btn{margin-top:-6px;color:var(--muted)}
.row2{display:flex;align-items:center;gap:10px;margin-top:6px;margin-left:-5px}
.stars{display:flex}
.stars button{
  width:32px;height:34px;display:grid;place-items:center;color:var(--star-off);
  transition:transform .12s;
}
.stars button svg{width:21px;height:21px}
.stars button.on{color:var(--star)}
.stars button:active{transform:scale(1.25)}
.stars.big button{width:46px;height:46px}
.stars.big button svg{width:32px;height:32px}
.tag{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;font-weight:550}
.tag i{width:7px;height:7px;border-radius:50%;display:block}
.notes{
  margin:6px 8px 0 0;color:var(--muted);font-size:15px;white-space:pre-wrap;word-wrap:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card.open .notes{display:block;-webkit-line-clamp:unset;color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:60px 24px;font-size:15px}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.foot{text-align:center;color:var(--muted);font-size:12.5px;padding:10px 0 0;opacity:.8}

.fab{
  position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:6;
  width:62px;height:62px;border-radius:31px;background:var(--accent);color:#fff;
  display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);
  transition:transform .12s;
}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px}

/* ---------- sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:20;pointer-events:none}
.sheet-wrap.on{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .25s}
.sheet-wrap.on .backdrop{opacity:1}
.sheet{
  position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 12px);
  background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.85,.25,1);
  max-width:640px;margin:0 auto;box-shadow:0 -6px 30px rgba(0,0,0,.18);
}
.sheet-wrap.on .sheet{transform:none}
.sh-head{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:8px 8px;border-bottom:1px solid var(--line);flex:none;
}
.sh-head h2{margin:0;font-size:17px;font-weight:650}
.txt-btn{height:40px;padding:0 10px;font-size:17px;color:var(--accent);justify-self:start}
.txt-btn.strong{font-weight:650;justify-self:end}
.sh-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px calc(40px + env(safe-area-inset-bottom));
}
.lbl{display:block;font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.lbl:first-child{margin-top:0}
textarea,.field{
  width:100%;border:0;border-radius:12px;background:var(--card);box-shadow:var(--shadow);
  padding:12px 14px;font-size:16px;outline:none;resize:none;-webkit-appearance:none;display:block;
}
textarea:focus,.field:focus{box-shadow:0 0 0 2px var(--accent)}
#f-text{font-weight:600;font-size:17px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick .chip{background:var(--card);box-shadow:var(--shadow)}
.pick .chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.danger{
  display:block;width:100%;margin-top:32px;height:48px;border-radius:12px;
  background:var(--card);box-shadow:var(--shadow);color:var(--danger);font-weight:600;
}
.sec{font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 10px}
.sec + .group, .group{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.catrow{display:flex;align-items:center;gap:2px;padding:4px 6px 4px 12px;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.swatch{width:24px;height:24px;border-radius:50%;flex:none;margin-right:8px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.catrow input{flex:1;min-width:0;border:0;background:none;font-size:16px;height:40px;outline:none;font-weight:550}
.catrow .del{color:var(--danger)}
.addcat{display:flex;gap:8px;margin-top:10px}
.addcat .field{flex:1;height:44px;padding:0 14px}
.btn{
  height:44px;padding:0 16px;border-radius:12px;background:var(--ink);color:var(--bg);
  font-weight:620;font-size:15px;flex:none;
}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btns{display:grid;gap:8px}
.btns .btn{width:100%}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.hint b{color:var(--ink);font-weight:600}
.spacer{height:28px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:16px;right:96px;bottom:calc(28px + env(safe-area-inset-bottom));z-index:30;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;font-size:15px;
  transform:translateY(20px);opacity:0;pointer-events:none;transition:all .22s;
  max-width:420px;
}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast span{flex:1}
.toast button{color:var(--accent);font-weight:700}
@media (prefers-color-scheme: dark){ .toast button{color:#c2410c} }
</style>
</head>
<body>

<header class="top" id="top">
  <div class="title-row">
    <h1>Starters</h1>
    <button class="icon-btn" id="btn-search" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="6.8"/><path d="m20 20-4-4"/></svg>
    </button>
    <button class="icon-btn" id="btn-menu" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </div>
  <div class="search" id="search"><input id="q" type="search" placeholder="Search statements and notes" autocomplete="off" enterkeyhint="search"></div>
  <nav class="chips" id="chips"></nav>
  <div class="sortbar">
    <div class="seg" id="sort">
      <button data-sort="rating">Top rated</button>
      <button data-sort="new">Newest</button>
      <button data-sort="az">A–Z</button>
    </div>
    <span class="count" id="count"></span>
  </div>
</header>

<main id="list"></main>

<button class="fab" id="fab" aria-label="Add starter">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="sheet-wrap" id="sheetwrap">
  <div class="backdrop" data-act="close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importfile" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';
const KEY = 'starters.v1', UIKEY = 'starters.ui';
const COLORS = ['#d9573b','#3b7dd9','#2f9e6b','#9b59d0','#d99a1e','#d93b7a','#1fa3a3','#7d7d88'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.75 5.86 6.4.78-4.72 4.42 1.22 6.34L12 17.06 6.35 20.2l1.22-6.34L2.85 9.44l6.4-.78z"/></svg>';
const ICON = {
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>'
};

/* ---------- data ---------- */
function seed() {
  const mk = (name, color) => ({ id: uid(), name, color });
  const cats = [mk('Date', COLORS[0]), mk('Friends', COLORS[1]), mk('Sports', COLORS[2]), mk('Family', COLORS[3])];
  const now = Date.now(); let k = 0;
  const it = (ci, text, rating, notes) => { const t = now - (k++) * 60000; return { id: uid(), cat: cats[ci].id, text, rating, notes, created: t, updated: t }; };
  return {
    v: 1, lastExport: 0, categories: cats,
    items: [
      it(0, "What's something you're weirdly good at?", 4, "Light and easy. Follow up: how'd you get into it?"),
      it(0, "Best trip you've ever taken — and the worst?", 5, "The two-sided version keeps it from being a résumé answer."),
      it(1, "What's a hot take you'll actually defend?", 5, "Great with a group, gets a debate going."),
      it(1, "What's something you changed your mind on recently?", 3, ""),
      it(2, "Who's the most overrated player right now?", 4, "Guaranteed argument."),
      it(2, "Best game you've ever watched live?", 4, ""),
      it(3, "What was life like when you were my age?", 5, "Works great with grandparents — let them run with it."),
      it(3, "What's a family story I've never heard?", 4, "")
    ]
  };
}
function sanitize(d) {
  if (!d || !Array.isArray(d.categories) || !Array.isArray(d.items)) return null;
  const cats = d.categories.filter(c => c && c.id && typeof c.name === 'string')
    .map((c, i) => ({ id: String(c.id), name: c.name.slice(0, 40), color: /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : COLORS[i % COLORS.length] }));
  const ids = new Set(cats.map(c => c.id));
  const items = d.items.filter(i => i && i.id && ids.has(String(i.cat)) && typeof i.text === 'string')
    .map(i => ({
      id: String(i.id), cat: String(i.cat), text: i.text,
      rating: Math.max(0, Math.min(5, Math.round(+i.rating || 0))),
      notes: typeof i.notes === 'string' ? i.notes : '',
      created: +i.created || Date.now(), updated: +i.updated || +i.created || Date.now()
    }));
  return { v: 1, lastExport: +d.lastExport || 0, categories: cats, items };
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = sanitize(JSON.parse(raw)); if (d) return d; } } catch (e) {}
  return seed();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Couldn’t save — storage is full or blocked'); }
}
let S = load();
let ui = { cat: 'all', sort: 'rating' };
try { Object.assign(ui, JSON.parse(localStorage.getItem(UIKEY) || '{}')); } catch (e) {}
const saveUI = () => { try { localStorage.setItem(UIKEY, JSON.stringify({ cat: ui.cat, sort: ui.sort })); } catch (e) {} };
let query = '';
save();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

const catById = id => S.categories.find(c => c.id === id);
const itemById = id => S.items.find(i => i.id === id);

/* ---------- main view ---------- */
function visible() {
  // searching always looks across every category
  const q = query.trim().toLowerCase();
  let a = (ui.cat === 'all' || q) ? S.items.slice() : S.items.filter(i => i.cat === ui.cat);
  if (q) a = a.filter(i => (i.text + '\n' + i.notes).toLowerCase().includes(q));
  if (ui.sort === 'rating') a.sort((x, y) => y.rating - x.rating || y.updated - x.updated);
  else if (ui.sort === 'new') a.sort((x, y) => y.created - x.created);
  else a.sort((x, y) => x.text.localeCompare(y.text, undefined, { sensitivity: 'base' }));
  return a;
}
function starsHTML(n) {
  let h = '';
  for (let i = 1; i <= 5; i++) h += `<button data-act="rate" data-n="${i}" class="${i <= n ? 'on' : ''}" aria-label="${i} star${i > 1 ? 's' : ''}">${STAR}</button>`;
  return h;
}
function renderChips() {
  const counts = {}; S.items.forEach(i => counts[i.cat] = (counts[i.cat] || 0) + 1);
  const chip = (id, name, n, color) =>
    `<button class="chip ${ui.cat === id ? 'on' : ''}" data-cat="${id}">${color ? `<span class="dot" style="background:${color}"></span>` : ''}${esc(name)}<span class="n">${n}</span></button>`;
  $('#chips').innerHTML = chip('all', 'All', S.items.length) + S.categories.map(c => chip(c.id, c.name, counts[c.id] || 0, c.color)).join('');
  const on = $('#chips .chip.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function renderList() {
  const a = visible();
  const showTag = ui.cat === 'all' || !!query.trim();
  $('#count').textContent = query.trim()
    ? `${a.length} ${a.length === 1 ? 'match' : 'matches'} · all categories`
    : `${a.length} ${a.length === 1 ? 'starter' : 'starters'}`;
  if (!a.length) {
    $('#list').innerHTML = query
      ? `<div class="empty"><strong>No matches</strong>Nothing here contains “${esc(query)}”.</div>`
      : `<div class="empty"><strong>Nothing here yet</strong>Tap + to add your first one.</div>`;
    return;
  }
  $('#list').innerHTML = a.map(it => {
    const c = catById(it.cat);
    return `<article class="card" data-id="${it.id}">
      <div class="row1"><p class="stmt">${esc(it.text)}</p><button class="icon-btn sm" data-act="edit" aria-label="Edit">${ICON.edit}</button></div>
      <div class="row2"><div class="stars">${starsHTML(it.rating)}</div>${showTag && c ? `<span class="tag"><i style="background:${c.color}"></i>${esc(c.name)}</span>` : ''}</div>
      ${it.notes ? `<p class="notes">${esc(it.notes)}</p>` : ''}
    </article>`;
  }).join('') + (S.categories.length > 0 ? `<p class="foot">Swipe sideways to switch categories</p>` : '');
}
function renderSort() { document.querySelectorAll('#sort button').forEach(b => b.classList.toggle('on', b.dataset.sort === ui.sort)); }
function render() {
  if (ui.cat !== 'all' && !catById(ui.cat)) ui.cat = 'all';
  renderChips(); renderSort(); renderList();
}
function setCat(id, dir) {
  if (id === ui.cat) return;
  ui.cat = id; saveUI(); render();
  const m = $('#list'); m.classList.remove('slide-l', 'slide-r');
  if (dir) { void m.offsetWidth; m.classList.add(dir > 0 ? 'slide-l' : 'slide-r'); }
  window.scrollTo({ top: 0 });
}
function stepCat(d) {
  const order = ['all', ...S.categories.map(c => c.id)];
  const i = order.indexOf(ui.cat), j = Math.max(0, Math.min(order.length - 1, i + d));
  if (j !== i) setCat(order[j], d);
}

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  const order = ['all', ...S.categories.map(c => c.id)];
  setCat(b.dataset.cat, Math.sign(order.indexOf(b.dataset.cat) - order.indexOf(ui.cat)));
});
$('#sort').addEventListener('click', e => {
  const b = e.target.closest('[data-sort]'); if (!b) return;
  ui.sort = b.dataset.sort; saveUI(); renderSort(); renderList();
});
$('#list').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const id = card.dataset.id, b = e.target.closest('[data-act]');
  if (b && b.dataset.act === 'rate') {
    const it = itemById(id), n = +b.dataset.n;
    it.rating = it.rating === n ? 0 : n; it.updated = Date.now(); save();
    // update in place so the card doesn't jump while you're tapping
    card.querySelectorAll('.stars button').forEach((s, i) => s.classList.toggle('on', i < it.rating));
    return;
  }
  if (b && b.dataset.act === 'edit') { openEditor(id); return; }
  card.classList.toggle('open');
});
$('#btn-search').addEventListener('click', () => {
  const s = $('#search'), on = !s.classList.contains('on');
  s.classList.toggle('on', on); $('#btn-search').classList.toggle('on', on);
  if (on) $('#q').focus(); else { $('#q').value = ''; query = ''; renderList(); }
});
$('#q').addEventListener('input', e => { query = e.target.value; renderList(); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#fab').addEventListener('click', () => openEditor(null));
$('#btn-menu').addEventListener('click', openMenu);
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', window.scrollY > 4), { passive: true });

// swipe between categories
let sx = null, sy = 0, st = 0;
const main = $('#list');
main.addEventListener('touchstart', e => { if (e.touches.length !== 1) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); }, { passive: true });
main.addEventListener('touchend', e => {
  if (sx == null) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
  if (Date.now() - st < 650 && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) stepCat(dx < 0 ? 1 : -1);
}, { passive: true });

/* ---------- sheet ---------- */
let sheetMode = null, draft = null;
function openSheet(html, mode) {
  sheetMode = mode;
  $('#sheet').innerHTML = html;
  $('#sheetwrap').classList.add('on');
  document.body.classList.add('locked');
}
function closeSheet() {
  if (document.activeElement) document.activeElement.blur();
  $('#sheetwrap').classList.remove('on');
  document.body.classList.remove('locked');
  sheetMode = null; draft = null;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetMode) closeSheet(); });

/* editor */
function openEditor(id) {
  if (!S.categories.length) { toast('Add a category first'); openMenu(); return; }
  const it = id ? itemById(id) : null;
  draft = {
    id, rating: it ? it.rating : 0,
    cat: it ? it.cat : (ui.cat !== 'all' ? ui.cat : S.categories[0].id)
  };
  openSheet(`
    <div class="sh-head">
      <button class="txt-btn" data-act="close">Cancel</button>
      <h2>${it ? 'Edit starter' : 'New starter'}</h2>
      <button class="txt-btn strong" data-act="save">Save</button>
    </div>
    <div class="sh-body">
      <label class="lbl" for="f-text">Statement</label>
      <textarea id="f-text" rows="3" placeholder="What's something you're weirdly good at?" enterkeyhint="next">${esc(it ? it.text : '')}</textarea>
      <span class="lbl">Category</span>
      <div class="pick" id="f-cat">${catPickHTML()}</div>
      <span class="lbl">Rating</span>
      <div class="stars big" id="f-rate">${starsHTML(draft.rating)}</div>
      <label class="lbl" for="f-notes">Notes</label>
      <textarea id="f-notes" rows="6" placeholder="Follow-ups, how it landed, when to use it…">${esc(it ? it.notes : '')}</textarea>
      ${it ? `<button class="danger" data-act="del">Delete starter</button>` : ''}
    </div>`, 'edit');
}
function catPickHTML() {
  return S.categories.map(c => `<button class="chip ${c.id === draft.cat ? 'on' : ''}" data-act="pickcat" data-id="${c.id}"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('');
}
function saveDraft() {
  const text = $('#f-text').value.trim();
  if (!text) { toast('Write the statement first'); $('#f-text').focus(); return; }
  const notes = $('#f-notes').value.replace(/\s+$/, '');
  const now = Date.now();
  if (draft.id) {
    Object.assign(itemById(draft.id), { text, notes, cat: draft.cat, rating: draft.rating, updated: now });
  } else {
    S.items.push({ id: uid(), cat: draft.cat, text, notes, rating: draft.rating, created: now, updated: now });
  }
  save(); closeSheet(); render();
}
function deleteItem(id) {
  const idx = S.items.findIndex(i => i.id === id); if (idx < 0) return;
  const [gone] = S.items.splice(idx, 1);
  save(); closeSheet(); render();
  toast('Starter deleted', 'Undo', () => { S.items.splice(idx, 0, gone); save(); render(); });
}

/* settings */
function openMenu() {
  openSheet(`
    <div class="sh-head"><span></span><h2>Settings</h2><button class="txt-btn strong" data-act="close">Done</button></div>
    <div class="sh-body" id="menubody">${menuBodyHTML()}</div>`, 'menu');
}
function menuBodyHTML() {
  const counts = {}; S.items.forEach(i => counts[i.cat] = (counts[i.cat] || 0) + 1);
  const last = S.lastExport ? new Date(S.lastExport).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : 'never';
  return `
    <h3 class="sec">Categories</h3>
    <div class="group">${S.categories.map((c, i) => `
      <div class="catrow" data-id="${c.id}">
        <button class="swatch" data-act="color" style="background:${c.color}" aria-label="Change colour"></button>
        <input value="${esc(c.name)}" data-act="rename" maxlength="40" enterkeyhint="done" aria-label="Category name">
        <button class="icon-btn sm" data-act="up" ${i === 0 ? 'disabled' : ''} aria-label="Move up">${ICON.up}</button>
        <button class="icon-btn sm" data-act="down" ${i === S.categories.length - 1 ? 'disabled' : ''} aria-label="Move down">${ICON.down}</button>
        <button class="icon-btn sm del" data-act="delcat" aria-label="Delete ${esc(c.name)} (${counts[c.id] || 0} starters)">${ICON.trash}</button>
      </div>`).join('') || '<p class="hint" style="padding:12px 14px;margin:0">No categories yet.</p>'}
    </div>
    <form class="addcat" id="addcat"><input class="field" id="newcat" placeholder="New category, e.g. Work" maxlength="40" enterkeyhint="done"><button class="btn" type="submit">Add</button></form>
    <p class="hint" style="margin-top:8px">Tap a colour dot to change it.</p>
    <div class="spacer"></div>
    <h3 class="sec">Backup</h3>
    <p class="hint">Everything is stored only on this phone. Export a backup now and then — if the app is removed or iOS clears its storage, the list is gone. Last backup: <b>${last}</b>.</p>
    <div class="btns">
      <button class="btn" data-act="export">Export backup</button>
      <button class="btn ghost" data-act="import">Restore from backup</button>
      <button class="btn ghost" data-act="csv">Export as CSV (Excel)</button>
    </div>`;
}
function refreshMenu() { const b = $('#menubody'); if (b) { const y = b.scrollTop; b.innerHTML = menuBodyHTML(); b.scrollTop = y; } }

$('#sheetwrap').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'close') return closeSheet();
  if (sheetMode === 'edit') {
    if (act === 'save') return saveDraft();
    if (act === 'del') { if (confirm('Delete this starter?')) deleteItem(draft.id); return; }
    if (act === 'pickcat') { draft.cat = b.dataset.id; $('#f-cat').innerHTML = catPickHTML(); return; }
    if (act === 'rate') {
      const n = +b.dataset.n; draft.rating = draft.rating === n ? 0 : n;
      $('#f-rate').querySelectorAll('button').forEach((s, i) => s.classList.toggle('on', i < draft.rating));
      return;
    }
  }
  if (sheetMode === 'menu') {
    const row = b.closest('.catrow'), id = row && row.dataset.id;
    const idx = S.categories.findIndex(c => c.id === id);
    if (act === 'color') {
      const c = S.categories[idx]; c.color = COLORS[(COLORS.indexOf(c.color) + 1) % COLORS.length];
      b.style.background = c.color; save(); render(); return;
    }
    if (act === 'up' || act === 'down') {
      const j = idx + (act === 'up' ? -1 : 1); if (j < 0 || j >= S.categories.length) return;
      [S.categories[idx], S.categories[j]] = [S.categories[j], S.categories[idx]];
      save(); refreshMenu(); render(); return;
    }
    if (act === 'delcat') {
      const c = S.categories[idx], n = S.items.filter(i => i.cat === id).length;
      if (!confirm(n ? `Delete “${c.name}” and its ${n} starter${n > 1 ? 's' : ''}? This can’t be undone.` : `Delete “${c.name}”?`)) return;
      S.categories.splice(idx, 1); S.items = S.items.filter(i => i.cat !== id);
      save(); refreshMenu(); render(); return;
    }
    if (act === 'export') return exportJSON();
    if (act === 'csv') return exportCSV();
    if (act === 'import') return $('#importfile').click();
  }
});
$('#sheetwrap').addEventListener('change', e => {
  if (e.target.dataset.act !== 'rename') return;
  const c = catById(e.target.closest('.catrow').dataset.id), v = e.target.value.trim();
  if (!v) { e.target.value = c.name; return; }
  c.name = v; save(); render();
});
$('#sheetwrap').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.act === 'rename') e.target.blur(); });
$('#sheetwrap').addEventListener('submit', e => {
  if (e.target.id !== 'addcat') return;
  e.preventDefault();
  const v = $('#newcat').value.trim(); if (!v) return;
  const used = S.categories.map(c => c.color);
  S.categories.push({ id: uid(), name: v.slice(0, 40), color: COLORS.find(c => !used.includes(c)) || COLORS[S.categories.length % COLORS.length] });
  save(); refreshMenu(); render();
  const f = $('#newcat'); if (f) f.focus();
});

/* ---------- import / export ---------- */
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
async function shareOrDownload(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return true; }
    catch (e) { if (e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}
async function exportJSON() {
  const data = JSON.stringify({ app: 'starters', exportedAt: new Date().toISOString(), ...S }, null, 2);
  if (await shareOrDownload(new Blob([data], { type: 'application/json' }), `starters-backup-${today()}.json`)) {
    S.lastExport = Date.now(); save(); refreshMenu(); toast('Backup exported');
  }
}
async function exportCSV() {
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [['Category', 'Statement', 'Rating', 'Notes']];
  S.categories.forEach(c => S.items.filter(i => i.cat === c.id).sort((a, b) => b.rating - a.rating)
    .forEach(i => rows.push([c.name, i.text, i.rating, i.notes])));
  const csv = '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
  await shareOrDownload(new Blob([csv], { type: 'text/csv' }), `starters-${today()}.csv`);
}
$('#importfile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = sanitize(JSON.parse(await f.text()));
    if (!d) throw new Error('bad');
    if (!confirm(`Restore ${d.items.length} starters in ${d.categories.length} categories? This replaces everything currently in the app.`)) return;
    d.lastExport = S.lastExport; S = d; save(); ui.cat = 'all'; saveUI();
    closeSheet(); render(); toast('Backup restored');
  } catch (err) { toast('That file isn’t a valid Starters backup'); }
});

/* ---------- toast ---------- */
let tt;
function toast(msg, label, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${label ? `<button>${esc(label)}</button>` : ''}`;
  if (label) t.querySelector('button').onclick = () => { action(); t.classList.remove('on'); };
  t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), label ? 5000 : 2600);
}

render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
